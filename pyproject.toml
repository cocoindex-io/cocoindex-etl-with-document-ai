[project]
name = "cocoindex-etl-with-document-ai"
version = "0.1.0"
description = "CocoIndex v1 example: parse PDFs with Google Document AI, embed, and store in Postgres/pgvector."
requires-python = ">=3.11"
dependencies = [
    "cocoindex[postgres,sentence_transformers]>=1.0.7",
    "asyncpg>=0.29.0",
    "pgvector>=0.4.1",
    "numpy",
    "google-cloud-documentai>=2.20.1",
    "python-dotenv>=1.0.1",
]

[tool.setuptools]
packages = []
